# Rollout - Simple Deployment
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: event-service
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      containers:
        - name: event-service
          image: docker.io/library/event-service:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
  strategy:
    canary:
      canaryService: event-service-canary
      stableService: event-service-stable
      trafficRouting:
        istio:
          virtualService:
            name: event-service-vsvc
            routes:
              - primary
      steps:
        - setWeight: 10
        - pause: {}
        - setWeight: 30
        - pause: {duration: 3}
        - setWeight: 100
