# Rollout - Simple Canary (không cần Ingress)
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: event-service
  namespace: default
  labels:
    app: event-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-service
  workloadMetadata:
    labels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      containers:
        - name: event-service
          image: nginx:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
  strategy:
    canary:
      canaryService: event-service-canary
      stableService: event-service-stable
      steps:
        - setWeight: 10
        - pause: {}
        - setWeight: 30
        - pause: {duration: 3}
        - setWeight: 100
