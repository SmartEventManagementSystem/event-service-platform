# ArgoCD Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: event-service-rollout
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SmartEventManagementSystem/event-service-platform.git
    path: argocd
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated: null
