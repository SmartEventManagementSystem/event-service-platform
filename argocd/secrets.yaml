# Event Service Secrets
apiVersion: v1
kind: Secret
metadata:
  name: event-service-secrets
  namespace: event-service
type: Opaque
stringData:
  db-host: postgres.dataplatform.svc.cluster.local
  db-user: events_user
  db-password: events_secure_pass_2024
  jwt-secret: super-secure-jwt-secret-change-in-production-minimum-32-chars
  kafka-api-key: ""
  kafka-api-secret: ""
---
# Database credentials (alternative secret)
apiVersion: v1
kind: Secret
metadata:
  name: event-service-db-credentials
  namespace: event-service
type: kubernetes.io/basic-auth
stringData:
  username: events_user
  password: events_secure_pass_2024
