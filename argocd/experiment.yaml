# Experiment - Test version mới trước khi deploy
apiVersion: argoproj.io/v1alpha1
kind: Experiment
metadata:
  name: event-service-test
  namespace: default
spec:
  duration: 30m
  templates:
    - name: event-service-test
      service:
        apiVersion: v1
        kind: Service
        metadata:
          name: event-service-test
        spec:
          selector:
            app: event-service
          ports:
            - port: 80
              targetPort: 80
      replicas: 1
      selector:
        matchLabels:
          app: event-service-test
      template:
        metadata:
          labels:
            app: event-service-test
        spec:
          containers:
            - name: event-service
              image: nginx:1.21
              ports:
                - containerPort: 80
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
