# Experiment - Test version mới trước khi deploy
apiVersion: argoproj.io/v1alpha1
kind: Experiment
metadata:
  name: event-service-test
  namespace: default
spec:
  duration: 30m
  successfulRuns: 1
  failedRuns: 1
  templates:
    - name: event-service-test
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: event-service
            experiment: event-service-test
        template:
          metadata:
            labels:
              app: event-service
              experiment: event-service-test
          spec:
            containers:
              - name: event-service
                image: nginx:1.21
                ports:
                  - containerPort: 80
