# ============================================
# KUSTOMIZATION - Để build manifests
# ============================================
# Chạy: kubectl kustomize infra/kubernetes/argocd
# Hoặc: kustomize build infra/kubernetes/argocd
# ============================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - rollout.yaml
  - services.yaml
  - experiment.yaml

commonLabels:
  app: event-service
  managed-by: argocd
