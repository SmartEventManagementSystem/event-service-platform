# Services - Stable & Canary
apiVersion: v1
kind: Service
metadata:
  name: event-service-stable
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: event-service
---
apiVersion: v1
kind: Service
metadata:
  name: event-service-canary
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: event-service
