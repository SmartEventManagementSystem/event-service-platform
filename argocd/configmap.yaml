# Event Service ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: event-service-config
  namespace: event-service
data:
  config.yaml: |
    app:
      name: event-service
      version: 1.0.0
      port: 8080
      environment: production

    server:
      read_timeout: 30s
      write_timeout: 30s
      idle_timeout: 60s

    database:
      host: ${DB_HOST}
      port: 5432
      user: ${DB_USER}
      password: ${DB_PASSWORD}
      name: ${DB_NAME}
      max_connections: 100

    kafka:
      brokers:
        - ${KAFKA_BROKERS}
      consumer_group: event-service-consumer
      topics:
        events: events.raw
        notifications: notifications.raw
        analytics: analytics.raw

    redis:
      host: ${REDIS_HOST}
      port: 6379
      db: 0
      pool_size: 10

    ai_service:
      url: ${AI_SERVICE_URL}
      timeout: 30s

    observability:
      metrics_enabled: true
      metrics_port: 9090
      tracing_enabled: true

    rate_limit:
      enabled: true
      requests_per_second: 100
